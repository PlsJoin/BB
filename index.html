<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Battle</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, "Noto Sans JP", sans-serif;
    color: #202124;
    background: #fff;
}

button,
input {
    font: inherit;
}

/* =========================
   TOP
========================= */

.topbar {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 18px;
    padding: 0 24px;
    font-size: 14px;
}

.topbar a {
    color: #202124;
    text-decoration: none;
}

.topbar a:hover {
    text-decoration: underline;
}

.apps {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    cursor: pointer;
}

.apps:hover {
    background: #f1f3f4;
}

.apps-grid {
    width: 18px;
    height: 18px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 3px;
}

.apps-grid span {
    width: 4px;
    height: 4px;
    background: #5f6368;
    border-radius: 50%;
}

.user-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #1a73e8;
    color: white;
    display: grid;
    place-items: center;
    font-weight: bold;
}

/* =========================
   GAME HEADER
========================= */

.game-header {
    border-bottom: 1px solid #dadce0;
    padding: 10px 24px 14px;
    display: none;
}

.game-header-inner {
    max-width: 900px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 22px;
}

.mini-logo {
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -1px;
}

.mini-logo span:nth-child(1) { color: #4285f4; }
.mini-logo span:nth-child(2) { color: #ea4335; }
.mini-logo span:nth-child(3) { color: #fbbc05; }
.mini-logo span:nth-child(4) { color: #4285f4; }
.mini-logo span:nth-child(5) { color: #34a853; }
.mini-logo span:nth-child(6) { color: #ea4335; }

/* =========================
   START SCREEN
========================= */

.start-screen {
    min-height: calc(100vh - 64px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 130px;
}

.logo {
    font-size: 86px;
    font-weight: 500;
    letter-spacing: -7px;
    margin-bottom: 30px;
}

.logo span:nth-child(1) { color: #4285f4; }
.logo span:nth-child(2) { color: #ea4335; }
.logo span:nth-child(3) { color: #fbbc05; }
.logo span:nth-child(4) { color: #4285f4; }
.logo span:nth-child(5) { color: #34a853; }
.logo span:nth-child(6) { color: #ea4335; }

.game-title {
    font-size: 18px;
    color: #5f6368;
    margin-bottom: 24px;
}

.search-box {
    width: min(584px, calc(100vw - 40px));
    height: 48px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    box-shadow: 0 1px 6px rgba(32,33,36,.12);
}

.search-icon {
    width: 20px;
    height: 20px;
    margin-right: 12px;
    color: #9aa0a6;
}

.search-input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    color: #202124;
    background: transparent;
}

.start-buttons {
    display: flex;
    gap: 12px;
    margin-top: 28px;
}

.start-button {
    border: 1px solid #f8f9fa;
    background: #f8f9fa;
    color: #202124;
    padding: 11px 22px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
}

.start-button:hover {
    border-color: #dadce0;
    box-shadow: 0 1px 1px rgba(0,0,0,.1);
}

.challenge-info {
    margin-top: 35px;
    color: #5f6368;
    font-size: 13px;
    text-align: center;
    line-height: 1.8;
}

/* =========================
   GAME
========================= */

.game-screen {
    display: none;
}

.challenge-bar {
    background: #f8f9fa;
    border-bottom: 1px solid #dadce0;
    padding: 18px 24px;
}

.challenge-inner {
    max-width: 1100px;
    margin: auto;
    display: flex;
    align-items: center;
    gap: 20px;
}

.challenge-label {
    color: #5f6368;
    font-size: 12px;
    white-space: nowrap;
}

.challenge-text {
    font-size: 18px;
    font-weight: 500;
    flex: 1;
}

.timer {
    min-width: 80px;
    text-align: right;
    font-size: 18px;
    font-weight: bold;
}

.score-mini {
    min-width: 120px;
    text-align: right;
    color: #188038;
    font-weight: bold;
}

/* =========================
   SEARCH
========================= */

.search-area {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 20px;
}

.game-search {
    width: 100%;
    height: 46px;
    border: 1px solid #dfe1e5;
    border-radius: 23px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    box-shadow: 0 1px 3px rgba(32,33,36,.12);
}

.game-search:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.18);
}

.search-submit {
    border: none;
    background: transparent;
    cursor: pointer;
    color: #4285f4;
    font-weight: bold;
}

/* =========================
   RESULTS
========================= */

.results {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 20px 80px;
}

.result-count {
    color: #70757a;
    font-size: 13px;
    margin: 18px 0;
}

.result {
    margin-bottom: 30px;
    max-width: 720px;
}

.result-url {
    color: #202124;
    font-size: 13px;
    margin-bottom: 4px;
}

.result-title {
    color: #1a0dab;
    font-size: 20px;
    margin: 0 0 5px;
    cursor: pointer;
    font-weight: 400;
}

.result-title:hover {
    text-decoration: underline;
}

.result-description {
    color: #4d5156;
    font-size: 14px;
    line-height: 1.6;
}

.result-meta {
    margin-top: 7px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
}

.badge {
    padding: 3px 7px;
    border-radius: 3px;
    font-weight: bold;
}

.badge-official {
    background: #e6f4ea;
    color: #137333;
}

.badge-ad {
    background: #fef7e0;
    color: #8a6116;
}

.badge-old {
    background: #f1f3f4;
    color: #5f6368;
}

.badge-fake {
    background: #fce8e6;
    color: #c5221f;
}

.result-source {
    color: #70757a;
}

/* =========================
   ANSWER PANEL
========================= */

.answer-panel {
    position: fixed;
    right: 24px;
    bottom: 24px;
    width: 320px;
    background: white;
    border: 1px solid #dadce0;
    box-shadow: 0 3px 14px rgba(60,64,67,.25);
    padding: 18px;
    z-index: 20;
}

.answer-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.answer-input {
    width: 100%;
    height: 42px;
    border: 1px solid #dadce0;
    padding: 0 12px;
    outline: none;
}

.answer-input:focus {
    border-color: #4285f4;
}

.submit-answer {
    width: 100%;
    margin-top: 10px;
    height: 40px;
    border: none;
    background: #1a73e8;
    color: white;
    cursor: pointer;
    border-radius: 4px;
    font-weight: bold;
}

.submit-answer:hover {
    background: #1765c1;
}

.hint {
    margin-top: 9px;
    font-size: 11px;
    color: #70757a;
    line-height: 1.5;
}

/* =========================
   RESULT DETAIL
========================= */

.result-detail {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,.98);
    z-index: 50;
    overflow-y: auto;
}

.detail-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 60px 25px 100px;
}

.close-detail {
    position: fixed;
    top: 20px;
    right: 25px;
    border: none;
    background: #f1f3f4;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 20px;
}

.detail-url {
    color: #188038;
    font-size: 14px;
    margin-bottom: 8px;
}

.detail-title {
    color: #1a0dab;
    font-size: 30px;
    margin-bottom: 25px;
}

.detail-content {
    font-size: 16px;
    line-height: 2;
    color: #3c4043;
}

.detail-content strong {
    color: #202124;
}

.source-warning {
    margin-top: 35px;
    padding: 18px;
    border-left: 4px solid #fbbc04;
    background: #fff8e1;
    font-size: 14px;
    line-height: 1.7;
}

/* =========================
   RESULT SCREEN
========================= */

.result-screen {
    display: none;
    min-height: 100vh;
    text-align: center;
    padding-top: 100px;
}

.result-logo {
    font-size: 45px;
    letter-spacing: -3px;
    margin-bottom: 35px;
}

.result-main {
    font-size: 60px;
    font-weight: bold;
    margin-bottom: 10px;
}

.result-label {
    color: #5f6368;
    margin-bottom: 40px;
}

.result-card {
    width: min(600px, calc(100vw - 40px));
    margin: auto;
    border: 1px solid #dadce0;
    padding: 25px;
    text-align: left;
}

.stat {
    display: flex;
    justify-content: space-between;
    padding: 13px 0;
    border-bottom: 1px solid #eee;
}

.stat:last-child {
    border-bottom: none;
}

.stat span:first-child {
    color: #5f6368;
}

.rank {
    margin-top: 25px;
    font-size: 18px;
    font-weight: bold;
}

.restart {
    margin-top: 30px;
    padding: 12px 25px;
    border: none;
    background: #1a73e8;
    color: white;
    cursor: pointer;
    border-radius: 4px;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .logo {
        font-size: 64px;
    }

    .start-screen {
        padding-top: 90px;
    }

    .challenge-inner {
        flex-wrap: wrap;
    }

    .challenge-text {
        width: 100%;
        order: 3;
    }

    .answer-panel {
        position: fixed;
        left: 12px;
        right: 12px;
        bottom: 12px;
        width: auto;
    }

    .results {
        padding-bottom: 180px;
    }
}
</style>
</head>

<body>

<!-- =========================
     TOP BAR
========================= -->

<div class="topbar">
    <a href="#">Gmail</a>
    <a href="#">画像</a>

    <div class="apps">
        <div class="apps-grid">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="user-icon">S</div>
</div>

<!-- =========================
     START
========================= -->

<section class="start-screen" id="startScreen">

    <div class="logo">
        <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <div class="game-title">
        SEARCH BATTLE
    </div>

    <div class="search-box">
        <div class="search-icon">⌕</div>
        <input
            class="search-input"
            id="startSearch"
            placeholder="検索してゲームを開始"
        >
    </div>

    <div class="start-buttons">
        <button class="start-button" onclick="startGame()">
            検索ゲームを開始
        </button>

        <button class="start-button" onclick="showRules()">
            遊び方
        </button>
    </div>

    <div class="challenge-info">
        WEBを検索して答えを探そう。<br>
        正確さだけではなく、情報を見極める力も重要です。
    </div>

</section>

<!-- =========================
     GAME
========================= -->

<section class="game-screen" id="gameScreen">

    <div class="game-header" id="gameHeader">
        <div class="game-header-inner">
            <div class="mini-logo">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
            </div>
        </div>
    </div>

    <div class="challenge-bar">

        <div class="challenge-inner">

            <div class="challenge-label">
                お題
            </div>

            <div class="challenge-text" id="challengeText">
                日本で一番高い山の標高を調べろ
            </div>

            <div class="timer" id="timer">
                90.0
            </div>

            <div class="score-mini" id="scoreMini">
                SCORE 0
            </div>

        </div>

    </div>

    <div class="search-area">

        <div class="game-search">

            <div class="search-icon">⌕</div>

            <input
                class="search-input"
                id="gameSearch"
                placeholder="検索"
                onkeydown="handleSearchKey(event)"
            >

            <button
                class="search-submit"
                onclick="performSearch()"
            >
                検索
            </button>

        </div>

    </div>

    <div class="results">

        <div class="result-count" id="resultCount">
            検索結果
        </div>

        <div id="resultList"></div>

    </div>

    <div class="answer-panel">

        <div class="answer-title">
            答えを入力
        </div>

        <input
            class="answer-input"
            id="answerInput"
            placeholder="例：3776m"

            class="submit-answer"
            onclick="submitAnswer()"
        >

        <div class="hint">
            答えだけでなく、情報源を見極めることが重要です。
        </div>

    </div>

</section>

<!-- =========================
     DETAIL
========================= -->

<div class="result-detail" id="resultDetail">

    <button class="close-detail" onclick="closeDetail()">
        ×
    </button>

    <div class="detail-inner">

        <div class="detail-url" id="detailUrl"></div>

        <div class="detail-title" id="detailTitle"></div>

        <div class="detail-content" id="detailContent"></div>

        <div class="source-warning" id="sourceWarning"></div>

    </div>

</div>

<!-- =========================
     RESULT
========================= -->

<section class="result-screen" id="resultScreen">

    <div class="result-logo">
        <span style="color:#4285f4">G</span><span style="color:#ea4335">o</span><span style="color:#fbbc05">o</span><span style="color:#4285f4">g</span><span style="color:#34a853">l</span><span style="color:#ea4335">e</span>
    </div>

    <div class="result-main" id="finalScore">
        0
    </div>

    <div class="result-label">
        SCORE
    </div>

    <div class="result-card">

        <div class="stat">
            <span>回答</span>
            <strong id="finalAnswer">-</strong>
        </div>

        <div class="stat">
            <span>正解</span>
            <strong id="correctAnswer">-</strong>
        </div>

        <div class="stat">
            <span>回答時間</span>
            <strong id="finalTime">-</strong>
        </div>

        <div class="stat">
            <span>情報源の評価</span>
            <strong id="sourceScore">-</strong>
        </div>

    </div>

    <div class="rank" id="rankText">
        検索結果を集計中...
    </div>

    <button class="restart" onclick="restartGame()">
        もう一度プレイ
    </button>

</section>

<script>

/* =====================================================
   GAME DATA
===================================================== */

const challenge = {
    question: "日本で一番高い山の標高を調べろ",
    answer: "3776",
    answerDisplay: "3,776m",
};

const searchDatabase = [

    {
        keywords: ["日本", "一番", "高い", "山", "富士山", "標高", "高さ"],

        url: "www.gsi.go.jp",
        title: "富士山の標高について | 国土地理院",
        description:
            "日本の国土に関する測量・地図情報を提供する国土地理院。富士山の標高は3,776mとされています。",

        type: "official",

        content:
            "<strong>富士山の標高は3,776mです。</strong><br><br>" +
            "国土地理院が公開している日本の地形・標高に関する情報です。" +
            "富士山は日本で最も高い山で、標高は3,776mです。",

        warning:
            "公的機関による情報。今回のお題では信頼性の高い情報源として扱えます。"
    },

    {
        keywords: ["日本", "一番", "高い", "山", "富士山", "標高"],

        url: "www.japan-guide.example",
        title: "日本で一番高い山ランキング！意外な山も紹介",
        description:
            "日本全国の山をランキング形式で紹介。富士山の高さや観光情報について詳しく解説します。",

        type: "normal",

        content:
            "日本で最も高い山として一般的に知られているのは富士山です。<br><br>" +
            "富士山の標高は3,776mと紹介されています。",

        warning:
            "内容はお題に関係していますが、公的な一次情報ではありません。"
    },

    {
        keywords: ["日本", "一番", "高い", "山", "標高"],

        url: "www.osusume-mountain.example",
        title: "【2026年最新】日本の高い山TOP10！知らないと損",
        description:
            "登山初心者必見！日本で一番高い山をランキング形式で紹介。おすすめ登山グッズも紹介しています。",

        type: "ad",

        content:
            "日本の高い山をランキング形式で紹介しています。<br><br>" +
            "記事内では富士山を1位として紹介しています。",

        warning:
            "商品紹介・広告への誘導を主目的とするサイト。情報が正しい可能性はありますが、今回のゲームでは信頼度を低く評価します。"
    },

    {
        keywords: ["日本", "一番", "高い", "山", "富士山", "標高"],

        url: "www.truth-news.example",
        title: "【衝撃】富士山の本当の高さは3776mではなかった？",
        description:
            "これまで常識だと思われていた富士山の標高。その数字には意外な秘密が隠されているという情報を独自調査しました。",

        type: "fake",

        content:
            "富士山の高さについて独自の説を紹介しています。<br><br>" +
            "一般的には3,776mとされていますが、この記事では別の数字を主張しています。",

        warning:
            "強い煽り表現を使い、根拠となる一次資料が明確ではありません。情報を鵜呑みにしない方がよいサイトとして設定されています。"
    },

    {
        keywords: ["日本", "一番", "高い", "山", "富士山"],

        url: "old-blog.example",
        title: "富士山について調べてみた【2014年】",
        description:
            "昔調べた日本の山についての個人ブログ。富士山について写真とともに紹介しています。",

        type: "old",

        content:
            "富士山は日本で一番高い山として紹介されています。<br><br>" +
            "記事は2014年に作成された個人ブログです。",

        warning:
            "内容自体は参考になりますが、古い個人ブログです。"
    }

];

/* =====================================================
   STATE
===================================================== */

let gameStarted = false;
let timeLeft = 90;
let timerInterval = null;
let currentScore = 0;
let searchCount = 0;
let openedSources = [];
let answerSubmitted = false;

/* =====================================================
   START
===================================================== */

function startGame() {

    document.getElementById("startScreen").style.display = "none";
    document.getElementById("gameScreen").style.display = "block";
    document.getElementById("gameHeader").style.display = "block";

    gameStarted = true;

    document.getElementById("challengeText").textContent =
        challenge.question;

    timeLeft = 90;

    updateTimer();

    timerInterval = setInterval(() => {

        timeLeft -= 0.1;

        if (timeLeft <= 0) {

            timeLeft = 0;

            clearInterval(timerInterval);

            if (!answerSubmitted) {
                submitAnswer();
            }

        }

        updateTimer();

    }, 100);

    document.getElementById("gameSearch").focus();

}

/* =====================================================
   TIMER
===================================================== */

function updateTimer() {

    document.getElementById("timer").textContent =
        timeLeft.toFixed(1);

}

/* =====================================================
   SEARCH
===================================================== */

function handleSearchKey(event) {

    if (event.key === "Enter") {
        performSearch();
    }

}

function performSearch() {

    const query =
        document.getElementById("gameSearch").value
        .trim()
        .toLowerCase();

    if (!query) return;

    searchCount++;

    const words = query
        .split(/\s+/)
        .filter(Boolean);

    const results = searchDatabase
        .map(item => {

            let score = 0;

            words.forEach(word => {

                item.keywords.forEach(keyword => {

                    if (keyword.includes(word) ||
                        word.includes(keyword)) {

                        score += 2;

                    }

                });

                if (item.title.toLowerCase().includes(word)) {
                    score += 3;
                }

                if (item.description.toLowerCase().includes(word)) {
                    score += 1;
                }

            });

            return {
                ...item,
                score
            };

        })
        .filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score);

    renderResults(results);

}

/* =====================================================
   RENDER RESULTS
===================================================== */

function renderResults(results) {

    const list = document.getElementById("resultList");

    list.innerHTML = "";

    document.getElementById("resultCount").textContent =
        `検索結果 ${results.length} 件`;

    if (results.length === 0) {

        list.innerHTML = `
            <div style="
                color:#5f6368;
                padding:30px 0;
            ">
                お探しの情報は見つかりませんでした。
            </div>
        `;

        return;
    }

    results.forEach((item, index) => {

        const div = document.createElement("div");

        div.className = "result";

        let badge = "";

        if (item.type === "official") {

            badge =
                `<span class="badge badge-official">公式</span>`;

        } else if (item.type === "ad") {

            badge =
                `<span class="badge badge-ad">広告</span>`;

        } else if (item.type === "old") {

            badge =
                `<span class="badge badge-old">古い情報</span>`;

        } else if (item.type === "fake") {

            badge =
                `<span class="badge badge-fake">要注意</span>`;

        }

        div.innerHTML = `

            <div class="result-url">
                ${item.url}
            </div>

            <h2
                class="result-title"
                onclick="openResult(${searchDatabase.indexOf(item)})"
            >
                ${item.title}
            </h2>

            <div class="result-description">
                ${item.description}
            </div>

            <div class="result-meta">
                ${badge}
                <span class="result-source">
                    ${item.type === "official"
                        ? "公的機関"
                        : "Webサイト"}
                </span>
            </div>

        `;

        list.appendChild(div);

    });

}

/* =====================================================
   OPEN SOURCE
===================================================== */

function openResult(index) {

    const item = searchDatabase[index];

    if (!openedSources.includes(index)) {
        openedSources.push(index);
    }

    document.getElementById("detailUrl").textContent =
        item.url;

    document.getElementById("detailTitle").textContent =
        item.title;

    document.getElementById("detailContent").innerHTML =
        item.content;

    document.getElementById("sourceWarning").textContent =
        item.warning;

    document.getElementById("resultDetail").style.display =
        "block";

}

/* =====================================================
   CLOSE SOURCE
===================================================== */

function closeDetail() {

    document.getElementById("resultDetail").style.display =
        "none";

}

/* =====================================================
   ANSWER
===================================================== */

function submitAnswer() {

    if (answerSubmitted) return;

    answerSubmitted = true;

    clearInterval(timerInterval);

    const answer =
        document.getElementById("answerInput")
        .value
        .trim();

    const normalized =
        answer.replace(/,/g, "")
              .replace(/m/g, "")
              .replace(/メートル/g, "")
              .replace(/\s/g, "");

    const correct =
        normalized === challenge.answer;

    const elapsed =
        90 - timeLeft;

    let score = 0;

    if (correct) {

        score += 5000;

        // 時間ボーナス
        score += Math.max(
            0,
            Math.round((90 - elapsed) * 40)
        );

        // 情報源ボーナス
        const hasOfficial =
            openedSources.some(index =>
                searchDatabase[index].type === "official"
            );

        if (hasOfficial) {
            score += 3000;
        }

        // 無駄な検索を減点
        score -= Math.max(
            0,
            (searchCount - 3) * 150
        );

        score = Math.max(0, score);

    }

    currentScore = score;

    showResult(
        answer,
        correct,
        elapsed
    );

}

/* =====================================================
   RESULT
===================================================== */

function showResult(answer, correct, elapsed) {

    document.getElementById("gameScreen").style.display =
        "none";

    document.getElementById("resultDetail").style.display =
        "none";

    document.getElementById("resultScreen").style.display =
        "block";

    document.getElementById("finalScore").textContent =
        currentScore.toLocaleString();

    document.getElementById("finalAnswer").textContent =
        answer || "未回答";

    document.getElementById("correctAnswer").textContent =
        challenge.answerDisplay;

    document.getElementById("finalTime").textContent =
        elapsed.toFixed(1) + "秒";

    const hasOfficial =
        openedSources.some(index =>
            searchDatabase[index].type === "official"
        );

    document.getElementById("sourceScore").textContent =
        hasOfficial
            ? "信頼性の高い情報源を確認"
            : "一次情報の確認なし";

    let rank;

    if (!correct) {

        rank =
            "答えを間違えました。検索結果の情報を見極めよう。";

    } else if (currentScore >= 7500) {

        rank =
            "検索マスター級 🔎";

    } else if (currentScore >= 5500) {

        rank =
            "かなり速い検索です。";

    } else {

        rank =
            "正解。ただし、まだ検索を速くできます。";

    }

    document.getElementById("rankText").textContent =
        rank;

}

/* =====================================================
   RULES
===================================================== */

function showRules() {

    alert(
        "【SEARCH BATTLE】\n\n" +
        "お題に合う答えをWEB検索で探します。\n\n" +
        "・検索結果を調べる\n" +
        "・複数の情報を比較する\n" +
        "・広告や怪しい情報を見極める\n" +
        "・できるだけ早く正解する\n\n" +
        "正確さと速度の両方が重要です。"
    );

}

/* =====================================================
   RESTART
===================================================== */

function restartGame() {

    clearInterval(timerInterval);

    gameStarted = false;
    timeLeft = 90;
    currentScore = 0;
    searchCount = 0;
    openedSources = [];
    answerSubmitted = false;

    document.getElementById("answerInput").value = "";
    document.getElementById("gameSearch").value = "";

    document.getElementById("resultList").innerHTML = "";

    document.getElementById("resultScreen").style.display =
        "none";

    document.getElementById("gameScreen").style.display =
        "none";

    document.getElementById("gameHeader").style.display =
        "none";

    document.getElementById("startScreen").style.display =
        "flex";

}

</script>
