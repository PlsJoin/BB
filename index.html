<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>フリマ - みんなのマーケット</title>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        "Yu Gothic",
        YuGothic,
        Arial,
        sans-serif;
    color: #222;
    background: #f5f5f5;
}

button,
input,
select,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

/* =========================
   HEADER
========================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
}

.header-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 18px;
}

.logo {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ff4b55;
    white-space: nowrap;
}

.search-box {
    flex: 1;
    position: relative;
}

.search-box input {
    width: 100%;
    height: 42px;
    border: 1px solid #d8d8d8;
    border-radius: 7px;
    background: #f7f7f7;
    padding: 0 46px 0 15px;
    outline: none;
    transition: 0.2s;
}

.search-box input:focus {
    background: #fff;
    border-color: #aaa;
}

.search-icon {
    position: absolute;
    right: 13px;
    top: 50%;
    transform: translateY(-50%);
    color: #777;
    font-size: 19px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    white-space: nowrap;
}

.header-link {
    font-size: 14px;
    color: #444;
}

.header-link:hover {
    color: #ff4b55;
}

.sell-button {
    border: none;
    background: #ff4b55;
    color: white;
    padding: 10px 18px;
    border-radius: 7px;
    font-weight: 700;
}

/* =========================
   NAV
========================= */

.category-nav {
    background: #fff;
    border-bottom: 1px solid #e8e8e8;
}

.category-nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 10px 20px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
}

.category-button {
    border: 1px solid #ddd;
    background: #fff;
    color: #444;
    border-radius: 20px;
    padding: 7px 15px;
    white-space: nowrap;
    font-size: 13px;
}

.category-button:hover,
.category-button.active {
    border-color: #ff4b55;
    color: #ff4b55;
}

/* =========================
   MAIN
========================= */

.main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 30px 20px 80px;
}

.hero {
    background: #fff;
    border-radius: 10px;
    padding: 30px;
    margin-bottom: 28px;
    border: 1px solid #e9e9e9;
}

.hero h1 {
    margin: 0 0 10px;
    font-size: 28px;
}

.hero p {
    margin: 0;
    color: #777;
    line-height: 1.7;
}

.section {
    margin-bottom: 38px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
}

.section-title {
    margin: 0;
    font-size: 20px;
}

.section-subtitle {
    font-size: 13px;
    color: #888;
}

.controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

.sort-select {
    border: 1px solid #ddd;
    background: #fff;
    border-radius: 6px;
    padding: 8px 12px;
    outline: none;
}

/* =========================
   PRODUCT GRID
========================= */

.product-grid {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 14px;
}

.product-card {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #e8e8e8;
    transition: transform 0.15s, box-shadow 0.15s;
    cursor: pointer;
}

.product-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
}

.product-image {
    aspect-ratio: 1 / 1;
    background: #eee;
    position: relative;
    overflow: hidden;
}

.product-image-inner {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
    background: linear-gradient(135deg, #f3f3f3, #e5e5e5);
}

.product-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(255,255,255,0.95);
    border-radius: 5px;
    padding: 4px 7px;
    font-size: 11px;
    font-weight: 700;
}

.favorite {
    position: absolute;
    right: 8px;
    bottom: 8px;
    width: 35px;
    height: 35px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,0.95);
    font-size: 19px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.favorite.active {
    color: #ff4b55;
}

.product-info {
    padding: 11px;
}

.product-name {
    font-size: 14px;
    line-height: 1.5;
    height: 42px;
    overflow: hidden;
}

.product-price {
    margin-top: 8px;
    font-size: 17px;
    font-weight: 800;
}

.product-meta {
    margin-top: 5px;
    display: flex;
    justify-content: space-between;
    color: #888;
    font-size: 11px;
}

/* =========================
   EMPTY
========================= */

.empty {
    background: #fff;
    border: 1px solid #e5e5e5;
    border-radius: 10px;
    text-align: center;
    padding: 60px 20px;
    color: #888;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.48);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
    padding: 20px;
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(900px, 100%);
    max-height: 90vh;
    overflow-y: auto;
    background: #fff;
    border-radius: 12px;
    position: relative;
}

.modal-close {
    position: absolute;
    right: 15px;
    top: 12px;
    width: 38px;
    height: 38px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.06);
    font-size: 22px;
    z-index: 2;
}

.product-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
}

.detail-image {
    min-height: 500px;
    background: #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 120px;
}

.detail-content {
    padding: 35px;
}

.detail-title {
    font-size: 22px;
    line-height: 1.5;
    margin: 0 0 18px;
}

.detail-price {
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 20px;
}

.detail-info {
    border-top: 1px solid #eee;
    border-bottom: 1px solid #eee;
    padding: 15px 0;
    margin-bottom: 20px;
}

.info-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 14px;
}

.info-row span:first-child {
    color: #888;
}

.detail-description {
    line-height: 1.8;
    color: #444;
    font-size: 14px;
    white-space: pre-line;
    margin-bottom: 25px;
}

.action-button {
    width: 100%;
    border: none;
    border-radius: 7px;
    padding: 14px;
    font-weight: 700;
    font-size: 16px;
    margin-bottom: 10px;
}

.buy-button {
    background: #ff4b55;
    color: #fff;
}

.negotiate-button {
    background: #fff;
    border: 1px solid #ff4b55;
    color: #ff4b55;
}

/* =========================
   FORM
========================= */

.form-modal {
    width: min(620px, 100%);
    background: #fff;
    border-radius: 12px;
    padding: 30px;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
}

.form-modal h2 {
    margin-top: 0;
}

.form-group {
    margin-bottom: 18px;
}

.form-group label {
    display: block;
    font-weight: 700;
    font-size: 14px;
    margin-bottom: 7px;
}

.form-group input,
.form-group textarea,
.form-group select {
    width: 100%;
    border: 1px solid #d8d8d8;
    border-radius: 7px;
    padding: 11px;
    outline: none;
    background: #fff;
}

.form-group textarea {
    min-height: 120px;
    resize: vertical;
}

.submit-button {
    width: 100%;
    border: none;
    border-radius: 7px;
    padding: 14px;
    background: #ff4b55;
    color: white;
    font-weight: 700;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    left: 50%;
    bottom: 25px;
    transform: translateX(-50%) translateY(20px);
    background: #222;
    color: white;
    padding: 13px 20px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: 0.25s;
    z-index: 500;
    font-size: 14px;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

/* =========================
   FOOTER
========================= */

.footer {
    background: #fff;
    border-top: 1px solid #e5e5e5;
    padding: 35px 20px;
    color: #777;
}

.footer-inner {
    max-width: 1200px;
    margin: 0 auto;
}

.footer-logo {
    color: #ff4b55;
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 10px;
}

.footer p {
    font-size: 12px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 1000px) {
    .product-grid {
        grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .header-actions .header-link {
        display: none;
    }
}

@media (max-width: 750px) {
    .header-inner {
        flex-wrap: wrap;
        gap: 10px;
    }

    .logo {
        font-size: 22px;
    }

    .search-box {
        order: 3;
        flex-basis: 100%;
    }

    .product-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .product-detail {
        grid-template-columns: 1fr;
    }

    .detail-image {
        min-height: 330px;
    }
}

@media (max-width: 500px) {
    .main {
        padding: 18px 10px 70px;
    }

    .hero {
        padding: 22px;
    }

    .hero h1 {
        font-size: 22px;
    }

    .product-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px;
    }

    .section-header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
    }

    .detail-content {
        padding: 22px;
    }

    .sell-button {
        padding: 9px 12px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <div class="logo">
            フリマ
        </div>

        <div class="search-box">
            <input
                id="searchInput"
                type="search"

        </div>

        <div class="header-actions">
            <button class="header-link" id="notificationButton">
                お知らせ
            </button>

            <button class="header-link" id="mypageButton">
                マイページ
            </button>

            <button class="sell-button" id="sellButton">
                出品する
            </button>
        </div>

    </div>
</header>

<nav class="category-nav">
    <div class="category-nav-inner">

        <button class="category-button active" data-category="すべて">
            すべて
        </button>

        <button class="category-button" data-category="ゲーム">
            ゲーム
        </button>

        <button class="category-button" data-category="スマホ・家電">
            スマホ・家電
        </button>

        <button class="category-button" data-category="ファッション">
            ファッション
        </button>

        <button class="category-button" data-category="本・漫画">
            本・漫画
        </button>

        <button class="category-button" data-category="ホビー">
            ホビー
        </button>

        <button class="category-button" data-category="その他">
            その他
        </button>

    </div>
</nav>

<main class="main">

    <section class="hero">
        <h1>欲しいものを、もっとおトクに。</h1>
        <p>
            みんなが出品した商品から、掘り出し物を探してみよう。
            <br>

        </p>
    </section>

        <div class="section-header">

        </div>

</main>

<footer class="footer">

</footer>

<!-- 商品詳細 -->

<div class="modal-overlay" id="productModal">

            ×
        </button>

        <div class="product-detail">

                <button

                >
                    購入する
                </button>

                <button
                    class="action-button negotiate-button"
                    id="negotiateButton"
                >
                    値下げを依頼する
                </button>

            </div>

        </div>

    </div>

</div>

<!-- 値下げ依頼 -->

<div class="modal-overlay" id="negotiateModal">

    <div class="form-modal">

        <button class="modal-close" id="negotiateClose">
            ×
        </button>

        <h2>値下げを依頼する</h2>

        <p style="color:#777;font-size:14px;">
            希望する価格を入力してください。
        </p>

        <div class="form-group">
            <label>現在の価格</label>
            <input id="currentPrice" type="text" readonly>
        </div>

        <div class="form-group">
            <label>希望価格</label>
            <input
                id="offerPrice"
                type="number"
                min="300"
                step="100"
                placeholder="例：5000"
            >
        </div>

        <button
            class="submit-button"
            id="sendOffer"
        >
            値下げを依頼する
        </button>

    </div>

</div>

<!-- 出品 -->

<div class="modal-overlay" id="sellModal">

    <div class="form-modal">

        <button class="modal-close" id="sellClose">
            ×
        </button>

        <h2>商品を出品する</h2>

        <form id="sellForm">

                <label>商品名</label>
                <input

                    type="text"

            </div>

            <div class="form-group">
                <label>価格</label>

                    required

            </div>

            <div class="form-group">
                <label>カテゴリ</label>

                    </option>

                    <option value="スマホ・家電">
                        スマホ・家電
                    </option>

                    <option value="ファッション">
                        ファッション
                    </option>

                    <option value="本・漫画">
                        本・漫画
                    </option>

                    <option value="ホビー">
                        ホビー
                    </option>

                    <option value="その他">
                        その他
                    </option>

                </select>

            </div>

            <div class="form-group">
                <label>商品の状態</label>

                <select id="sellCondition">

                    <option>
                        新品、未使用
                    </option>

                    <option>
                        未使用に近い
                    </option>

                    <option>
                        目立った傷や汚れなし
                    </option>

                    <option>
                        やや傷や汚れあり
                    </option>

                    <option>
                        傷や汚れあり
                    </option>

                </select>

            </div>

            <div class="form-group">
                <label>商品説明</label>

                <textarea
                    id="sellDescription"
                    placeholder="商品の状態や注意点などを入力してください"
                    required
                ></textarea>

            </div>

            <button
                class="submit-button"
                type="submit"
            >
                出品する
            </button>

        </form>

    </div>

</div>

<div class="toast" id="toast"></div>

        icon: "🧥",
        likes: 15,
        description:
            "古着のデニムジャケットです。\n古着特有の使用感があります。"
    },

    {
        id: 10,
        name: "ゲーム攻略大全",
        price: 900,
        category: "本・漫画",
        condition: "目立った傷や汚れなし",
        shipping: "送料込み",
        seller: "reader",
        date: "3時間前",
        icon: "📖",
        likes: 5,
        description:
            "ゲーム攻略本です。\n書き込みなどはありません。"
    }

];

let currentCategory = "すべて";
let currentProduct = null;
let likedProducts = new Set();

/* =========================
   ELEMENTS
========================= */

const productGrid =
    document.getElementById("productGrid");

const searchInput =
    document.getElementById("searchInput");

const sortSelect =
    document.getElementById("sortSelect");

const productModal =
    document.getElementById("productModal");

const negotiateModal =
    document.getElementById("negotiateModal");

const sellModal =
    document.getElementById("sellModal");

const toast =
    document.getElementById("toast");

/* =========================
   RENDER
========================= */

function renderProducts() {

    let keyword =
        searchInput.value.trim().toLowerCase();

    let filtered =
        products.filter(product => {

            const categoryMatch =
                currentCategory === "すべて" ||
                product.category === currentCategory;

            const keywordMatch =
                !keyword ||
                product.name.toLowerCase().includes(keyword) ||
                product.description.toLowerCase().includes(keyword);

            return categoryMatch && keywordMatch;
        });

    const sort =
        sortSelect.value;

    if (sort === "low") {

        filtered.sort(
            (a, b) => a.price - b.price
        );

    } else if (sort === "high") {

        filtered.sort(
            (a, b) => b.price - a.price
        );

    } else if (sort === "new") {

        filtered.sort(
            (a, b) => a.id - b.id
        );
    }

    productGrid.innerHTML = "";

    if (filtered.length === 0) {

        productGrid.innerHTML = `
            <div class="empty" style="grid-column:1/-1;">
                <div style="font-size:42px;margin-bottom:12px;">
                    🔎
                </div>
                <strong>商品が見つかりませんでした</strong>
                <p>検索条件を変えてみてください。</p>
            </div>
        `;

        return;
    }

    filtered.forEach(product => {

        const card =
            document.createElement("article");

        card.className = "product-card";

        card.innerHTML = `

            <div class="product-image">

                <div class="product-image-inner">
                    ${product.icon}
                </div>

                <div class="product-badge">
                    ${product.condition}
                </div>

                <button
                    class="favorite ${
                        likedProducts.has(product.id)
                            ? "active"
                            : ""
                    }"
                    data-like="${product.id}"
                    aria-label="いいね"
                    type="button"
                >
                    ${
                        likedProducts.has(product.id)
                            ? "♥"
                            : "♡"
                    }
                </button>

            </div>

            <div class="product-info">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-price">
                    ¥${product.price.toLocaleString()}
                </div>

                <div class="product-meta">

                    <span>
                        ${product.shipping}
                    </span>

                    <span>
                        ♡ ${product.likes}
                    </span>

                </div>

            </div>
        `;

        card.addEventListener(
            "click",
            event => {

                if (
                    event.target.closest("[data-like]")
                ) {
                    return;
                }

                openProduct(product);
            }
        );

        const likeButton =
            card.querySelector("[data-like]");

        likeButton.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                toggleLike(product.id);
            }
        );

        productGrid.appendChild(card);
    });
}

/* =========================
   PRODUCT DETAIL
========================= */

function openProduct(product) {

    currentProduct = product;

    document.getElementById("detailImage").textContent =
        product.icon;

    document.getElementById("detailTitle").textContent =
        product.name;

    document.getElementById("detailPrice").textContent =
        "¥" + product.price.toLocaleString();

    document.getElementById("detailCondition").textContent =
        product.condition;

    document.getElementById("detailShipping").textContent =
        product.shipping;

    document.getElementById("detailSeller").textContent =
        product.seller;

    document.getElementById("detailDate").textContent =
        product.date;

    document.getElementById("detailDescription").textContent =
        product.description;

    productModal.classList.add("show");
}

function closeProduct() {

    productModal.classList.remove("show");
}

/* =========================
   LIKE
========================= */

function toggleLike(id) {

    if (likedProducts.has(id)) {

        likedProducts.delete(id);

        showToast("いいねを取り消しました");

    } else {

        likedProducts.add(id);

        showToast("いいねしました");
    }

    renderProducts();
}

/* =========================
   NEGOTIATE
========================= */

function openNegotiation() {

    if (!currentProduct) {
        return;
    }

    document.getElementById("currentPrice").value =
        "¥" + currentProduct.price.toLocaleString();

    document.getElementById("offerPrice").value =
        "";

    negotiateModal.classList.add("show");
}

function closeNegotiation() {

    negotiateModal.classList.remove("show");
}

document
    .getElementById("sendOffer")
    .addEventListener("click", () => {

        const value =
            Number(
                document.getElementById("offerPrice").value
            );

        if (!Number.isFinite(value)) {

            showToast("希望価格を入力してください");

            return;
        }

        if (value < 300) {

            showToast("希望価格は300円以上で入力してください");

            return;
        }

        if (value >= currentProduct.price) {

            showToast(
                "現在価格より安い金額を入力してください"
            );

            return;
        }

        closeNegotiation();

        showToast(
            "¥" +
            value.toLocaleString() +
            "で値下げを依頼しました"
        );
    });

/* =========================
   BUY
========================= */

document
    .getElementById("buyButton")
    .addEventListener("click", () => {

        if (!currentProduct) {
            return;
        }

        closeProduct();

        showToast(
            "購入手続きへ進みます"
        );
    });

/* =========================
   SELL
========================= */

document
    .getElementById("sellButton")
    .addEventListener("click", () => {

        sellModal.classList.add("show");
    });

document
    .getElementById("sellForm")
    .addEventListener("submit", event => {

        event.preventDefault();

        const name =
            document.getElementById("sellName").value.trim();

        const price =
            Number(
                document.getElementById("sellPrice").value
            );

        const category =
            document.getElementById("sellCategory").value;

        const condition =
            document.getElementById("sellCondition").value;

        const description =
            document.getElementById("sellDescription").value.trim();

        if (!name) {

            showToast("商品名を入力してください");

            return;
        }

        if (!Number.isFinite(price) || price < 300) {

            showToast("価格は300円以上で入力してください");

            return;
        }

        if (!description) {

            showToast("商品説明を入力してください");

            return;
        }

        const newProduct = {

            id:
                Date.now(),

            name:
                name,

            price:
                price,

            category:
                category,

            condition:
                condition,

            shipping:
                "送料込み",

            seller:
                "あなた",

            date:
                "たった今",

            icon:
                category === "ゲーム"
                    ? "🎮"
                    : category === "スマホ・家電"
                    ? "📱"
                    : category === "ファッション"
                    ? "👕"
                    : category === "本・漫画"
                    ? "📚"
                    : category === "ホビー"
                    ? "🧸"
                    : "📦",

            likes:
                0,

            description:
                description
        };

        products.unshift(newProduct);

        event.target.reset();

        sellModal.classList.remove("show");

        currentCategory = "すべて";

        document
            .querySelectorAll(".category-button")
            .forEach(button => {

                button.classList.toggle(
                    "active",
                    button.dataset.category === "すべて"
                );
            });

        renderProducts();

        showToast("商品を出品しました");
    });

/* =========================
   CATEGORY
========================= */

document
    .querySelectorAll(".category-button")
    .forEach(button => {

        button.addEventListener("click", () => {

            currentCategory =
                button.dataset.category;

            document
                .querySelectorAll(".category-button")
                .forEach(item => {

                    item.classList.remove("active");
                });

            button.classList.add("active");

            renderProducts();
        });
    });

/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
    "input",
    () => {

        renderProducts();
    }
);

/* =========================
   SORT
========================= */

sortSelect.addEventListener(
    "change",
    () => {

        renderProducts();
    }
);

/* =========================
   CLOSE BUTTONS
========================= */

document
    .getElementById("productModalClose")
    .addEventListener(
        "click",
        closeProduct
    );

document
    .getElementById("negotiateClose")
    .addEventListener(
        "click",
        closeNegotiation
    );

document
    .getElementById("sellClose")
    .addEventListener(
        "click",
        () => {

            sellModal.classList.remove("show");
        }
    );

document
    .getElementById("negotiateButton")
    .addEventListener(
        "click",
        openNegotiation
    );

/* =========================
   OUTSIDE CLICK
========================= */

productModal.addEventListener(
    "click",
    event => {

        if (
            event.target === productModal
        ) {
            closeProduct();
        }
    }
);

negotiateModal.addEventListener(
    "click",
    event => {

        if (
            event.target === negotiateModal
        ) {
            closeNegotiation();
        }
    }
);

sellModal.addEventListener(
    "click",
    event => {

        if (
            event.target === sellModal
        ) {
            sellModal.classList.remove("show");
        }
    }
);

/* =========================
   HEADER BUTTONS
========================= */

document
    .getElementById("notificationButton")
    .addEventListener(
        "click",
        () => {

            showToast(
                "新しいお知らせはありません"
            );
        }
    );

document
    .getElementById("mypageButton")
    .addEventListener(
        "click",
        () => {

            showToast(
                "マイページ機能は準備中です"
            );
        }
    );

/* =========================
   TOAST
========================= */

let toastTimer;

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            toast.classList.remove("show");

        }, 2400);
}

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* =========================
   INITIALIZE
========================= */

renderProducts();
</script>

</body>
</html>
