<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEARCH BATTLE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    font-family: Arial, "Noto Sans JP", sans-serif;
    background: #fff;
    color: #202124;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   共通
========================= */

.hidden {
    display: none !important;
}

/* =========================
   Google風 TOPBAR
========================= */

.topbar {
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 22px;
    gap: 20px;
    font-size: 13px;
}

.topbar a {
    color: #202124;
    text-decoration: none;
}

.topbar a:hover {
    text-decoration: underline;
}

.apps {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.apps:hover {
    background: #f1f3f4;
}

.apps-grid {
    width: 18px;
    height: 18px;
    display: grid;
    grid-template-columns: repeat(3, 4px);
    grid-template-rows: repeat(3, 4px);
    gap: 2px;
}

.apps-grid span {
    background: #5f6368;
    border-radius: 50%;
}

.user-icon {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #4285f4;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
}

/* =========================
   START
========================= */

#startScreen {
    min-height: calc(100vh - 60px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 115px;
}

.logo {
    font-size: 74px;
    font-weight: 500;
    letter-spacing: -5px;
    margin-bottom: 22px;
    user-select: none;
}

.logo span:nth-child(1) { color: #4285f4; }
.logo span:nth-child(2) { color: #ea4335; }
.logo span:nth-child(3) { color: #fbbc05; }
.logo span:nth-child(4) { color: #4285f4; }
.logo span:nth-child(5) { color: #34a853; }
.logo span:nth-child(6) { color: #ea4335; }

.game-title {
    font-size: 26px;
    font-weight: 500;
    margin-bottom: 30px;
    letter-spacing: 2px;
}

.start-search {
    width: min(620px, 90vw);
    height: 50px;
    border: 1px solid #dfe1e5;
    border-radius: 28px;
    display: flex;
    align-items: center;
    padding: 0 18px;
    box-shadow: 0 1px 6px rgba(32,33,36,.12);
    margin-bottom: 25px;
}

.start-search-icon {
    width: 18px;
    height: 18px;
    border: 2px solid #9aa0a6;
    border-radius: 50%;
    position: relative;
    margin-right: 15px;
}

.start-search-icon::after {
    content: "";
    width: 7px;
    height: 2px;
    background: #9aa0a6;
    position: absolute;
    right: -5px;
    bottom: -2px;
    transform: rotate(45deg);
}

.start-search-text {
    color: #5f6368;
    font-size: 15px;
}

.start-buttons {
    display: flex;
    gap: 12px;
}

.start-buttons button {
    border: 1px solid #f8f9fa;
    background: #f8f9fa;
    color: #202124;
    padding: 11px 18px;
    border-radius: 4px;
    font-size: 14px;
}

.start-buttons button:hover {
    border-color: #dadce0;
    box-shadow: 0 1px 1px rgba(0,0,0,.1);
}

.start-info {
    margin-top: 50px;
    color: #70757a;
    font-size: 13px;
}

/* =========================
   GAME
========================= */

#gameScreen {
    min-height: 100vh;
    background: #fff;
}

.game-header {
    height: 72px;
    border-bottom: 1px solid #dadce0;
    display: flex;
    align-items: center;
    padding: 0 28px;
    gap: 28px;
}

.small-logo {
    font-size: 25px;
    letter-spacing: -2px;
    font-weight: 500;
    white-space: nowrap;
}

.small-logo span:nth-child(1) { color: #4285f4; }
.small-logo span:nth-child(2) { color: #ea4335; }
.small-logo span:nth-child(3) { color: #fbbc05; }
.small-logo span:nth-child(4) { color: #4285f4; }
.small-logo span:nth-child(5) { color: #34a853; }
.small-logo span:nth-child(6) { color: #ea4335; }

.game-status {
    margin-left: auto;
    display: flex;
    gap: 24px;
    align-items: center;
    font-size: 14px;
}

.timer {
    font-weight: bold;
    color: #d93025;
    min-width: 80px;
}

.score-display {
    color: #3c4043;
}

/* 問題 */

.question-box {
    width: min(900px, 92vw);
    margin: 32px auto 20px;
    padding: 22px 25px;
    background: #f8f9fa;
    border: 1px solid #dadce0;
    border-radius: 8px;
}

.question-label {
    font-size: 12px;
    color: #5f6368;
    margin-bottom: 8px;
}

.question-text {
    font-size: 22px;
    font-weight: 500;
}

/* 検索 */

.search-area {
    width: min(760px, 92vw);
    margin: 0 auto 25px;
}

.search-box {
    height: 48px;
    border: 1px solid #dfe1e5;
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 15px;
    box-shadow: 0 1px 4px rgba(32,33,36,.15);
}

.search-box:focus-within {
    box-shadow: 0 1px 6px rgba(32,33,36,.25);
}

.search-icon {
    width: 17px;
    height: 17px;
    border: 2px solid #9aa0a6;
    border-radius: 50%;
    position: relative;
    margin-right: 13px;
    flex-shrink: 0;
}

.search-icon::after {
    content: "";
    position: absolute;
    width: 6px;
    height: 2px;
    background: #9aa0a6;
    right: -5px;
    bottom: -2px;
    transform: rotate(45deg);
}

.search-input {
    border: none;
    outline: none;
    flex: 1;
    height: 100%;
    font-size: 16px;
}

.search-button {
    border: none;
    background: #4285f4;
    color: white;
    border-radius: 4px;
    padding: 9px 16px;
    font-size: 14px;
}

.search-button:hover {
    background: #3367d6;
}

/* =========================
   検索結果
========================= */

.results-area {
    width: min(760px, 92vw);
    margin: 0 auto;
    padding-bottom: 160px;
}

.result-count {
    color: #70757a;
    font-size: 13px;
    margin-bottom: 22px;
}

.result {
    margin-bottom: 28px;
    cursor: pointer;
}

.result:hover .result-title {
    text-decoration: underline;
}

.result-url {
    color: #188038;
    font-size: 13px;
    margin-bottom: 4px;
}

.ad-label {
    display: inline-block;
    color: #5f6368;
    border: 1px solid #dadce0;
    border-radius: 3px;
    padding: 1px 5px;
    margin-right: 5px;
    font-size: 11px;
}

.result-title {
    color: #1a0dab;
    font-size: 20px;
    margin-bottom: 5px;
    line-height: 1.35;
}

.result-description {
    color: #4d5156;
    font-size: 14px;
    line-height: 1.6;
}

/* =========================
   回答パネル
========================= */

.answer-panel {
    position: fixed;
    right: 22px;
    bottom: 20px;
    width: 340px;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 10px;
    padding: 17px;
    box-shadow: 0 4px 18px rgba(0,0,0,.16);
    z-index: 50;
}

.answer-title {
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 10px;
}

.answer-row {
    display: flex;
    gap: 8px;
}

.answer-input {
    flex: 1;
    height: 40px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    padding: 0 10px;
    outline: none;
}

.answer-input:focus {
    border-color: #4285f4;
}

.submit-answer {
    height: 40px;
    border: none;
    background: #4285f4;
    color: white;
    border-radius: 4px;
    padding: 0 15px;
    font-weight: bold;
}

.submit-answer:hover {
    background: #3367d6;
}

/* =========================
   SITE VIEWER
========================= */

#siteScreen {
    position: fixed;
    inset: 0;
    background: #fff;
    z-index: 100;
    overflow: auto;
}

.browser-bar {
    height: 58px;
    background: #f1f3f4;
    border-bottom: 1px solid #dadce0;
    display: flex;
    align-items: center;
    padding: 0 18px;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
}

.browser-back {
    width: 38px;
    height: 38px;
    border: none;
    background: transparent;
    border-radius: 50%;
    font-size: 23px;
    color: #5f6368;
}

.browser-back:hover {
    background: #e0e0e0;
}

.browser-address {
    flex: 1;
    max-width: 800px;
    height: 38px;
    background: #fff;
    border: 1px solid #dadce0;
    border-radius: 20px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    color: #5f6368;
    font-size: 14px;
}

.browser-lock {
    margin-right: 9px;
    font-size: 13px;
}

.browser-close {
    margin-left: auto;
    border: none;
    background: #fff;
    border: 1px solid #dadce0;
    padding: 9px 14px;
    border-radius: 5px;
    color: #3c4043;
}

.browser-close:hover {
    background: #f8f9fa;
}

/* サイト本体 */

.site-page {
    min-height: calc(100vh - 58px);
}

/* 公式サイト */

.official-site {
    background: #fff;
}

.official-header {
    background: #1665a7;
    color: #fff;
    padding: 20px calc((100% - 1050px) / 2);
}

.official-header-inner {
    max-width: 1050px;
    margin: auto;
}

.official-name {
    font-size: 25px;
    font-weight: bold;
}

.official-sub {
    font-size: 12px;
    opacity: .9;
    margin-top: 5px;
}

.official-nav {
    background: #0d4f86;
    color: white;
    padding: 12px calc((100% - 1050px) / 2);
}

.official-nav-inner {
    max-width: 1050px;
    margin: auto;
    display: flex;
    gap: 30px;
    font-size: 14px;
}

.official-content {
    max-width: 1050px;
    margin: 0 auto;
    padding: 35px 20px 80px;
}

.breadcrumb {
    color: #666;
    font-size: 13px;
    margin-bottom: 25px;
}

.official-content h1 {
    font-size: 29px;
    border-left: 6px solid #1665a7;
    padding-left: 15px;
    margin-bottom: 25px;
}

.official-content p {
    line-height: 2;
    color: #333;
}

.info-box {
    margin-top: 25px;
    border: 1px solid #ccc;
    background: #f5f8fb;
    padding: 25px;
}

.big-number {
    font-size: 38px;
    font-weight: bold;
    color: #155a8d;
}

/* 普通サイト */

.normal-site {
    background: #fff;
}

.normal-header {
    border-bottom: 1px solid #eee;
    padding: 22px 25px;
}

.normal-header-inner {
    max-width: 900px;
    margin: auto;
}

.normal-logo {
    font-size: 24px;
    font-weight: bold;
}

.normal-nav {
    margin-top: 15px;
    color: #666;
    font-size: 13px;
}

.normal-content {
    max-width: 900px;
    margin: 0 auto;
    padding: 45px 25px;
}

.article-meta {
    color: #888;
    font-size: 12px;
    margin-bottom: 14px;
}

.normal-content h1 {
    font-size: 32px;
    line-height: 1.45;
    margin: 0 0 25px;
}

.normal-content p {
    line-height: 2;
    color: #444;
    font-size: 15px;
}

.quote-box {
    margin: 25px 0;
    padding: 20px;
    background: #f7f7f7;
    border-left: 4px solid #999;
}

/* 広告サイト */

.ad-site {
    background: #fafafa;
}

.ad-header {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 18px 25px;
}

.ad-header-inner {
    max-width: 1000px;
    margin: auto;
}

.ad-logo {
    font-size: 25px;
    font-weight: bold;
}

.ad-nav {
    margin-top: 12px;
    font-size: 13px;
    color: #777;
}

.ad-content {
    max-width: 1000px;
    margin: auto;
    padding: 30px 20px 80px;
}

.ad-hero {
    background: #fff;
    border: 1px solid #ddd;
    padding: 30px;
}

.ad-hero h1 {
    font-size: 31px;
    line-height: 1.45;
    margin-top: 0;
}

.ad-copy {
    color: #555;
    line-height: 1.9;
}

.ad-product {
    margin-top: 25px;
    padding: 20px;
    border: 1px solid #ddd;
    background: #fff;
}

.ad-button {
    display: inline-block;
    margin-top: 15px;
    background: #f39c12;
    color: white;
    padding: 11px 20px;
    border-radius: 4px;
    font-weight: bold;
}

/* デマサイト */

.fake-site {
    background: #fff;
}

.fake-header {
    background: #111;
    color: white;
    padding: 18px 25px;
}

.fake-header-inner {
    max-width: 950px;
    margin: auto;
}

.fake-logo {
    font-weight: bold;
    font-size: 22px;
}

.fake-warning {
    background: #d93025;
    color: white;
    padding: 10px;
    text-align: center;
    font-size: 13px;
}

.fake-content {
    max-width: 950px;
    margin: auto;
    padding: 35px 20px 80px;
}

.fake-content h1 {
    font-size: 38px;
    line-height: 1.35;
    margin-bottom: 15px;
}

.fake-meta {
    color: #777;
    font-size: 12px;
    margin-bottom: 25px;
}

.fake-content p {
    line-height: 2;
    font-size: 16px;
}

.fake-highlight {
    margin: 25px 0;
    padding: 22px;
    background: #fff3f3;
    border: 1px solid #f1b5b5;
    font-weight: bold;
}

/* 古いサイト */

.old-site {
    background: #e7e0c8;
    min-height: 100%;
    font-family: "MS Gothic", monospace;
}

.old-wrapper {
    width: min(820px, 95vw);
    margin: 20px auto;
    background: #fff;
    border: 4px ridge #aaa;
    min-height: 700px;
}

.old-top {
    background: #000080;
    color: white;
    padding: 12px;
    font-size: 22px;
    font-weight: bold;
}

.old-body {
    padding: 20px;
}

.old-body h1 {
    font-size: 25px;
    color: #000080;
}

.old-body p {
    line-height: 1.8;
}

.old-link {
    color: blue;
    text-decoration: underline;
}

.old-box {
    border: 2px inset #aaa;
    padding: 15px;
    background: #eee;
    margin-top: 20px;
}

/* =========================
   RESULT
========================= */

#resultScreen {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #f8f9fa;
    padding: 30px;
}

.result-card {
    width: min(620px, 95vw);
    background: white;
    border: 1px solid #dadce0;
    border-radius: 12px;
    padding: 35px;
    box-shadow: 0 3px 15px rgba(0,0,0,.08);
    text-align: center;
}

.result-logo {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -2px;
    margin-bottom: 20px;
}

.final-score {
    font-size: 58px;
    font-weight: bold;
    color: #4285f4;
    margin: 10px 0 25px;
}

.result-line {
    border-top: 1px solid #eee;
    padding: 14px 0;
    display: flex;
    justify-content: space-between;
    text-align: left;
    font-size: 14px;
}

.result-line strong {
    color: #202124;
}

.restart-button {
    margin-top: 25px;
    background: #4285f4;
    border: none;
    color: white;
    padding: 12px 22px;
    border-radius: 5px;
    font-weight: bold;
}

.restart-button:hover {
    background: #3367d6;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .logo {
        font-size: 58px;
    }

    .game-header {
        padding: 0 15px;
        gap: 10px;
    }

    .small-logo {
        font-size: 20px;
    }

    .game-status {
        gap: 10px;
    }

    .question-box {
        margin-top: 20px;
    }

    .question-text {
        font-size: 18px;
    }

    .answer-panel {
        left: 12px;
        right: 12px;
        width: auto;
        bottom: 12px;
    }

    .browser-close {
        display: none;
    }

    .official-header,
    .official-nav {
        padding-left: 20px;
        padding-right: 20px;
    }

    .official-content h1,
    .normal-content h1,
    .ad-hero h1,
    .fake-content h1 {
        font-size: 25px;
    }
}
</style>
</head>

<body>

<!-- =========================
     START SCREEN
========================= -->

<div id="startScreen">

    <div class="topbar" style="position:absolute;top:0;right:0;">
        <a href="javascript:void(0)">Gmail</a>
        <a href="javascript:void(0)">画像</a>

        <div class="apps">
            <div class="apps-grid">
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
                <span></span><span></span><span></span>
            </div>
        </div>

        <div class="user-icon">S</div>
    </div>

    <div class="logo">
        <span>S</span>
        <span>E</span>
        <span>A</span>
        <span>R</span>
        <span>C</span>
        <span>H</span>
    </div>

    <div class="game-title">
        SEARCH BATTLE
    </div>

    <div class="start-search">
        <div class="start-search-icon"></div>
        <div class="start-search-text">
            Webを検索して、答えを見つけよう
        </div>
    </div>

    <div class="start-buttons">
        <button onclick="startGame()">
            検索ゲームを開始
        </button>

        <button onclick="showHowTo()">
            遊び方
        </button>
    </div>

    <div class="start-info">
        検索力・情報判断力・速度を競うWEBゲーム
    </div>

</div>


<!-- =========================
     GAME SCREEN
========================= -->

<div id="gameScreen" class="hidden">

    <div class="game-header">

        <div class="small-logo">
            <span>S</span>
            <span>E</span>
            <span>A</span>
            <span>R</span>
            <span>C</span>
            <span>H</span>
        </div>

        <div class="game-status">
            <div class="timer">
                残り <span id="timer">90</span> 秒
            </div>

            <div class="score-display">
                SCORE: <span id="score">0</span>
            </div>
        </div>

    </div>


    <div class="question-box">

        <div class="question-label">
            SEARCH BATTLE / QUESTION
        </div>

        <div class="question-text" id="questionText">
            日本で一番高い山の標高を調べろ
        </div>

    </div>


    <div class="search-area">

        <div class="search-box">

            <div class="search-icon"></div>

            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="検索"
                autocomplete="off"
                onkeydown="if(event.key === 'Enter') searchWeb()"
            >

            <button
                class="search-button"
                onclick="searchWeb()"
            >
                検索
            </button>

        </div>

    </div>


    <div id="resultsArea" class="results-area">

        <div class="result-count">
            検索結果はここに表示されます
        </div>

    </div>


    <!-- 回答パネル -->
    <div class="answer-panel">

        <div class="answer-title">
            答えを入力
        </div>

        <div class="answer-row">

            <input
                id="answerInput"
                class="answer-input"
                type="text"
                placeholder="例：3776"
                autocomplete="off"
                onkeydown="if(event.key === 'Enter') submitAnswer()"
            >

            <button
                class="submit-answer"
                onclick="submitAnswer()"
            >
                回答
            </button>

        </div>

    </div>

</div>


<!-- =========================
     SITE SCREEN
========================= -->

<div id="siteScreen" class="hidden">

    <div class="browser-bar">

        <button
            class="browser-back"
            onclick="closeSite()"
            title="検索結果へ戻る"
        >
            ←
        </button>

        <div class="browser-address">

            <span class="browser-lock">
                🔒
            </span>

            <span id="siteUrl">
                https://example.com
            </span>

        </div>

        <button
            class="browser-close"
            onclick="closeSite()"
        >
            検索結果へ戻る
        </button>

    </div>

    <div id="sitePage" class="site-page"></div>

</div>


<!-- =========================
     RESULT SCREEN
========================= -->

<div id="resultScreen" class="hidden">

    <div class="result-card">

        <div class="result-logo">
            SEARCH BATTLE
        </div>

        <div>
            GAME RESULT
        </div>

        <div class="final-score" id="finalScore">
            0
        </div>

        <div class="result-line">
            <span>あなたの回答</span>

/* =====================================================
   GAME STATE
===================================================== */

let timeLeft = 90;
let timerInterval = null;

let currentScore = 0;
let searchCount = 0;
let openedSites = new Set();

let gameStarted = false;
let gameFinished = false;


/* =====================================================
   START GAME
===================================================== */

function startGame() {

    document.getElementById("startScreen")
        .classList.add("hidden");

    document.getElementById("gameScreen")
        .classList.remove("hidden");

    document.getElementById("resultScreen")
        .classList.add("hidden");

    document.getElementById("siteScreen")
        .classList.add("hidden");

    document.getElementById("questionText").textContent =
        gameData.question;

    gameStarted = true;
    gameFinished = false;

    timeLeft = 90;
    currentScore = 0;
    searchCount = 0;
    openedSites.clear();

    document.getElementById("timer").textContent = timeLeft;
    document.getElementById("score").textContent = currentScore;

    document.getElementById("searchInput").focus();

    startTimer();
}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    clearInterval(timerInterval);

    timerInterval = setInterval(() => {

        if (!gameStarted || gameFinished) {
            return;
        }

        timeLeft--;

        if (timeLeft < 0) {
            timeLeft = 0;
        }

        document.getElementById("timer").textContent =
            timeLeft;

        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            submitAnswer();

        }

    }, 1000);
}


/* =====================================================
   SEARCH
===================================================== */

function searchWeb() {

    if (!gameStarted || gameFinished) {
        return;
    }

    const input =
        document.getElementById("searchInput").value
            .trim()
            .toLowerCase();

    if (!input) {
        return;
    }

    searchCount++;

    const resultsArea =
        document.getElementById("resultsArea");

    let results = [...gameData.sites];

    /*
        簡易検索。
        入力内容に応じて関連しそうな結果を上位へ。
    */

    results.sort((a, b) => {

        const aText =
            (a.title + " " + a.description)
                .toLowerCase();

        const bText =
            (b.title + " " + b.description)
                .toLowerCase();

        const aScore =
            calculateSearchMatch(aText, input);

        const bScore =
            calculateSearchMatch(bText, input);

        return bScore - aScore;

    });

    resultsArea.innerHTML = `
        <div class="result-count">
            約 ${results.length} 件の検索結果
        </div>
    `;

    results.forEach((site, index) => {

        const result =
            document.createElement("div");

        result.className = "result";

        let adHTML = "";

        if (site.type === "ad") {
            adHTML = `<span class="ad-label">スポンサー</span>`;
        }

        result.innerHTML = `
            <div class="result-url">
                ${adHTML}
                ${escapeHTML(site.url)}
            </div>

            <div class="result-title">
                ${escapeHTML(site.title)}
            </div>

            <div class="result-description">
                ${escapeHTML(site.description)}
            </div>
        `;

        result.addEventListener("click", () => {
            openSite(
                gameData.sites.indexOf(site)
            );
        });

        resultsArea.appendChild(result);

    });

}


/* =====================================================
   SEARCH MATCH
===================================================== */

function calculateSearchMatch(text, query) {

    const words =
        query.split(/\s+/).filter(Boolean);

    let score = 0;

    words.forEach(word => {

        if (text.includes(word)) {
            score += 10;
        }

    });

    return score;
}


/* =====================================================
   OPEN SITE
===================================================== */

function openSite(index) {

    if (!gameStarted || gameFinished) {
        return;
    }

    const site =
        gameData.sites[index];

    if (!site) {
        return;
    }

    openedSites.add(index);

    document.getElementById("siteUrl").textContent =
        "https://" + site.url;

    document.getElementById("sitePage").innerHTML =
        site.page;

    document.getElementById("siteScreen")
        .classList.remove("hidden");

    /*
        サイトを開いた時点で、
        ページの先頭から読めるようにする。
    */

    document.getElementById("siteScreen")
        .scrollTop = 0;

}


/* =====================================================
   CLOSE SITE
===================================================== */

function closeSite() {

    document.getElementById("siteScreen")
        .classList.add("hidden");

}


/* =====================================================
   ANSWER
===================================================== */

function submitAnswer() {

    if (!gameStarted || gameFinished) {
        return;
    }

    gameFinished = true;

    clearInterval(timerInterval);

    const answer =
        document.getElementById("answerInput")
            .value
            .trim();

    const normalizedAnswer =
        normalizeAnswer(answer);

    const normalizedCorrect =
        normalizeAnswer(gameData.answer);

    const isCorrect =
        normalizedAnswer === normalizedCorrect;

    let finalScore = 0;

    if (isCorrect) {

        /*
            基本点
        */
        finalScore += 5000;

        /*
            時間ボーナス
        */
        finalScore += timeLeft * 100;

        /*
            情報源を見ることで加点
        */
        const officialOpened =
            [...openedSites].some(
                index =>
                    gameData.sites[index].type === "official"
            );

        if (officialOpened) {
            finalScore += 3000;
        }

        /*
            検索しすぎると少し減点
        */
        if (searchCount > 3) {
            finalScore -=
                (searchCount - 3) * 250;
        }

        /*
            サイトを一切見ずに答えた場合は減点
        */
        if (openedSites.size === 0) {
            finalScore -= 2000;
        }

    } else {

        finalScore = 0;

    }

    if (finalScore < 0) {
        finalScore = 0;
    }

    currentScore = finalScore;

    showResult(
        answer,
        isCorrect
    );

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalizeAnswer(value) {

    return value
        .replace(/,/g, "")
        .replace(/ｍ/g, "m")
        .replace(/\s/g, "")
        .toLowerCase();

}


/* =====================================================
   RESULT
===================================================== */

function showResult(answer, isCorrect) {

    document.getElementById("gameScreen")
        .classList.add("hidden");

    document.getElementById("siteScreen")
        .classList.add("hidden");

    document.getElementById("resultScreen")
        .classList.remove("hidden");

    document.getElementById("finalScore")
        .textContent =
            currentScore.toLocaleString();

    document.getElementById("finalAnswer")
        .textContent =
            answer || "未回答";

    document.getElementById("correctAnswer")
        .textContent =
            gameData.answer + " m";

    document.getElementById("finalTime")
        .textContent =
            timeLeft + "秒";

    document.getElementById("openedSites")
        .textContent =
            openedSites.size;

}

===================================================== */

    alert(

        "② 検索して情報を探す\n\n" +

        "④ サイトの情報を読み比べる\n\n" +

        "正確さだけでなく、速度も重要です。"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

===================================================== */

document.getElementById("questionText").textContent =
    gameData.question;
