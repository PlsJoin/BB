<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>フリマ</title>

<style>
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Yu Gothic",YuGothic,Arial,sans-serif;
    color:#222;
    background:#f5f5f5;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

/* =========================
   HEADER
========================= */

.header{
    height:64px;
    background:#fff;
    border-bottom:1px solid #ddd;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1180px;
    height:100%;
    margin:auto;
    display:flex;
    align-items:center;
    gap:18px;
    padding:0 18px;
}

.logo{
    font-size:23px;
    font-weight:800;
    color:#e53935;
    white-space:nowrap;
}

.search{
    flex:1;
    position:relative;
}

.search input{
    width:100%;
    height:42px;
    border:1px solid #ccc;
    background:#f5f5f5;
    border-radius:7px;
    padding:0 46px 0 16px;
    outline:none;
    font-size:14px;
}

.search input:focus{
    border-color:#aaa;
    background:#fff;
}

.search-icon{
    position:absolute;
    right:14px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
    font-size:18px;
}

.header-actions{
    display:flex;
    align-items:center;
    gap:16px;
    white-space:nowrap;
}

.header-link{
    border:0;
    background:none;
    color:#444;
    font-size:13px;
}

.header-link:hover{
    color:#e53935;
}

.sell-button{
    border:0;
    background:#e53935;
    color:white;
    padding:11px 18px;
    border-radius:7px;
    font-weight:bold;
}

/* =========================
   CATEGORY BAR
========================= */

.category-bar{
    background:#fff;
    border-bottom:1px solid #ddd;
}

.category-inner{
    max-width:1180px;
    margin:auto;
    display:flex;
    gap:22px;
    overflow-x:auto;
    padding:12px 18px;
}

.category-button{
    border:0;
    background:none;
    color:#555;
    font-size:13px;
    white-space:nowrap;
    padding:3px 0;
}

.category-button.active{
    color:#e53935;
    font-weight:bold;
}

/* =========================
   MAIN
========================= */

.main{
    max-width:1180px;
    margin:auto;
    padding:24px 18px 70px;
}

/* =========================
   NOTICE
========================= */

.notice{
    display:none;
    background:#fff;
    border:1px solid #ddd;
    border-radius:8px;
    padding:15px 17px;
    margin-bottom:20px;
}

.notice.show{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.notice strong{
    color:#e53935;
}

.notice button{
    border:0;
    background:#e53935;
    color:#fff;
    padding:8px 14px;
    border-radius:5px;
}

/* =========================
   HERO
========================= */

.hero{
    background:#fff;
    border:1px solid #e5e5e5;
    padding:30px;
    border-radius:8px;
    margin-bottom:28px;
}

.hero h1{
    margin:0 0 10px;
    font-size:26px;
}

.hero p{
    margin:0;
    color:#777;
    font-size:14px;
}

/* =========================
   TOOLBAR
========================= */

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.result-count{
    font-size:14px;
    color:#555;
}

.sort{
    border:1px solid #ccc;
    background:#fff;
    border-radius:6px;
    padding:8px 12px;
}

/* =========================
   PRODUCT GRID
========================= */

.products{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:16px;
}

.product{
    background:#fff;
    border-radius:7px;
    overflow:hidden;
    border:1px solid #e6e6e6;
    cursor:pointer;
    transition:.15s;
}

.product:hover{
    transform:translateY(-2px);
    box-shadow:0 4px 14px rgba(0,0,0,.08);
}

.product-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    display:block;
    background:#eee;
}

.product-body{
    padding:10px 11px 13px;
}

.product-name{
    font-size:13px;
    line-height:1.5;
    min-height:39px;
    margin-bottom:6px;
}

.product-price{
    font-size:16px;
    font-weight:bold;
}

.product-meta{
    color:#888;
    font-size:11px;
    margin-top:5px;
}

.product-like{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:8px;
    color:#888;
    font-size:11px;
}

.like-button{
    border:0;
    background:none;
    padding:0;
    color:#777;
}

.like-button.liked{
    color:#e53935;
}

/* =========================
   EMPTY
========================= */

.empty{
    display:none;
    text-align:center;
    background:#fff;
    border:1px solid #ddd;
    padding:70px 20px;
    color:#777;
}

.empty.show{
    display:block;
}

/* =========================
   MODAL
========================= */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    align-items:center;
    justify-content:center;
    z-index:2000;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:#fff;
    width:min(900px,100%);
    max-height:90vh;
    overflow:auto;
    border-radius:8px;
    position:relative;
}

.modal-small{
    width:min(500px,100%);
}

.modal-close{
    position:absolute;
    right:15px;
    top:12px;
    width:35px;
    height:35px;
    border:0;
    background:#f5f5f5;
    border-radius:50%;
    font-size:20px;
    z-index:2;
}

.modal-content{
    padding:30px;
}

/* =========================
   PRODUCT DETAIL
========================= */

.detail{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:35px;
}

.detail-image{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    background:#eee;
}

.detail-info h2{
    font-size:21px;
    line-height:1.5;
    margin:0 0 16px;
}

.detail-price{
    font-size:29px;
    font-weight:bold;
    margin-bottom:6px;
}

.detail-shipping{
    font-size:13px;
    color:#777;
    margin-bottom:20px;
}

.detail-description{
    font-size:14px;
    line-height:1.8;
    white-space:pre-wrap;
    padding:15px 0;
    border-top:1px solid #eee;
    border-bottom:1px solid #eee;
}

.seller{
    display:flex;
    align-items:center;
    gap:12px;
    padding:18px 0;
}

.seller-avatar{
    width:42px;
    height:42px;
    background:#eee;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
}

.detail-actions{
    display:grid;
    gap:10px;
    margin-top:18px;
}

.primary{
    border:0;
    background:#e53935;
    color:white;
    padding:15px;
    border-radius:6px;
    font-weight:bold;
    font-size:15px;
}

.secondary{
    border:1px solid #ddd;
    background:#fff;
    color:#333;
    padding:13px;
    border-radius:6px;
    font-weight:bold;
}

.secondary:hover{
    background:#f8f8f8;
}

.primary:disabled,
.secondary:disabled{
    opacity:.45;
    cursor:not-allowed;
}

/* =========================
   FORM
========================= */

.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    font-size:13px;
    font-weight:bold;
    margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;
    border:1px solid #ccc;
    border-radius:6px;
    padding:12px;
    outline:none;
    background:#fff;
}

.form-group textarea{
    min-height:110px;
    resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:#999;
}

/* =========================
   PRICE REQUEST
========================= */

.price-current{
    background:#f7f7f7;
    padding:16px;
    margin-bottom:20px;
    border-radius:6px;
}

.price-current span{
    color:#777;
    font-size:12px;
}

.price-current strong{
    display:block;
    font-size:24px;
    margin-top:5px;
}

.price-input-wrap{
    position:relative;
}

.price-input-wrap span{
    position:absolute;
    left:12px;
    top:50%;
    transform:translateY(-50%);
    color:#777;
}

.price-input-wrap input{
    padding-left:28px;
    font-size:20px;
    font-weight:bold;
}

/* =========================
   PURCHASE
========================= */

.purchase-summary{
    background:#f7f7f7;
    padding:18px;
    border-radius:6px;
    margin-bottom:20px;
}

.purchase-row{
    display:flex;
    justify-content:space-between;
    margin-bottom:10px;
    font-size:14px;
}

.purchase-row.total{
    border-top:1px solid #ddd;
    padding-top:15px;
    margin-top:15px;
    font-weight:bold;
    font-size:18px;
}

/* =========================
   MY PAGE
========================= */

.mypage{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:20px;
}

.my-menu{
    background:#fff;
    border:1px solid #ddd;
}

.my-menu button{
    width:100%;
    text-align:left;
    padding:15px;
    background:#fff;
    border:0;
    border-bottom:1px solid #eee;
}

.my-menu button:hover{
    background:#f7f7f7;
}

.my-content{
    background:#fff;
    border:1px solid #ddd;
    padding:25px;
}

.my-profile{
    border-bottom:1px solid #eee;
    padding-bottom:20px;
    margin-bottom:20px;
}

.balance{
    font-size:28px;
    font-weight:bold;
    margin-top:7px;
}

.history-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:15px 0;
    border-bottom:1px solid #eee;
}

.history-item img{
    width:70px;
    height:70px;
    object-fit:cover;
}

/* =========================
   SELL
========================= */

.sell-preview{
    border:1px dashed #bbb;
    background:#fafafa;
    padding:35px;
    text-align:center;
    color:#888;
    margin-bottom:20px;
}

/* =========================
   TOAST
========================= */

.toast{
    position:fixed;
    left:50%;
    bottom:30px;
    transform:translate(-50%,30px);
    background:#333;
    color:#fff;
    padding:13px 20px;
    border-radius:7px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:5000;
    font-size:13px;
}

.toast.show{
    opacity:1;
    transform:translate(-50%,0);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:1000px){
    .products{
        grid-template-columns:repeat(4,1fr);
    }
}

@media(max-width:760px){
    .header{
        height:auto;
    }

    .header-inner{
        flex-wrap:wrap;
        padding:10px 12px;
    }

    .logo{
        order:1;
    }

    .header-actions{
        order:2;
        margin-left:auto;
    }

    .search{
        order:3;
        flex-basis:100%;
    }

    .detail{
        grid-template-columns:1fr;
        gap:20px;
    }

    .products{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .hero{
        padding:22px;
    }

    .mypage{
        grid-template-columns:1fr;
    }

    .main{
        padding:15px 10px 50px;
    }
}

@media(max-width:450px){
    .header-link{
        display:none;
    }

    .sell-button{
        padding:8px 12px;
        font-size:12px;
    }

    .product-name{
        font-size:12px;
    }
}
</style>
</head>

<body>

<!-- =========================
     HEADER
========================= -->

<header class="header">
    <div class="header-inner">

        <div class="logo">フリマ</div>

        <div class="search">
            <input
                id="searchInput"
                type="text"
                placeholder="なにをお探しですか？"
                autocomplete="off"
            >
            <span class="search-icon">⌕</span>
        </div>

        <div class="header-actions">

            <button
                class="header-link"
                onclick="openNotifications()"
            >
                お知らせ
            </button>

            <button
                class="header-link"
                onclick="openMypage()"
            >
                マイページ
            </button>

            <button
                class="sell-button"
                onclick="openSell()"
            >
                出品
            </button>

        </div>
    </div>
</header>

<!-- =========================
     CATEGORY
========================= -->

<nav class="category-bar">
    <div class="category-inner">

        <button class="category-button active"
            data-category="すべて">
            すべて
        </button>

        <button class="category-button"
            data-category="レディース">
            レディース
        </button>

        <button class="category-button"
            data-category="メンズ">
            メンズ
        </button>

        <button class="category-button"
            data-category="ベビー・キッズ">
            ベビー・キッズ
        </button>

        <button class="category-button"
            data-category="ゲーム・おもちゃ・グッズ">
            ゲーム・おもちゃ・グッズ
        </button>

        <button class="category-button"
            data-category="家電・スマホ・カメラ">
            家電・スマホ・カメラ
        </button>

        <button class="category-button"
            data-category="本・音楽・ゲーム">
            本・音楽・ゲーム
        </button>

        <button class="category-button"
            data-category="その他">
            その他
        </button>

    </div>
</nav>

<!-- =========================
     MAIN
========================= -->

<main class="main">

    <div
        id="notice"
        class="notice"
    >
        <div>
            <strong id="noticeTitle">お知らせがあります</strong>
            <div id="noticeText">
                値下げ依頼を確認してください。
            </div>
        </div>

        <button onclick="openNotifications()">
            確認する
        </button>
    </div>

    <section class="hero">
        <h1>欲しいものを、もっと身近に。</h1>
        <p>
            たくさんの商品から気になるものを探してみよう。
        </p>
    </section>

    <div class="toolbar">

        <div
            class="result-count"
            id="resultCount"
        >
            商品
        </div>

        <select
            class="sort"
            id="sortSelect"
        >
            <option value="recommended">おすすめ順</option>
            <option value="new">新しい順</option>
            <option value="low">価格の安い順</option>
            <option value="high">価格の高い順</option>
            <option value="like">いいね！が多い順</option>
        </select>

    </div>

    <div
        class="products"
        id="products"
    ></div>

    <div
        class="empty"
        id="empty"
    >
        商品が見つかりませんでした。
    </div>

</main>

<!-- =========================
     PRODUCT MODAL
========================= -->

<div
    class="modal"
    id="productModal"
    onclick="outsideClose(event,'productModal')"
>
    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeModal('productModal')"
        >
            ×
        </button>

        <div
            class="modal-content"
            id="productDetail"
        ></div>

    </div>
</div>

<!-- =========================
     PRICE REQUEST MODAL
========================= -->

<div
    class="modal"
    id="priceModal"
>
    <div class="modal-box modal-small">

        <button
            class="modal-close"
            onclick="closeModal('priceModal')"
        >
            ×
        </button>

        <div class="modal-content">

            <h2>値下げ依頼</h2>

            <p
                id="priceRequestProduct"
                style="color:#666;font-size:14px;"
            ></p>

            <div class="price-current">

                <span>現在の販売価格</span>

                <strong id="requestCurrentPrice">
                    ￥0
                </strong>

            </div>

            <div class="form-group">

                <label>
                    希望価格
                </label>

                <div class="price-input-wrap">

                    <span>￥</span>

                    <input
                        id="requestPrice"
                        type="number"
                        min="300"
                        step="1"
                        placeholder="希望価格を入力"
                    >

                </div>

            </div>

            <p
                style="font-size:12px;color:#888;line-height:1.6;"
            >
                出品者が承諾した場合、その価格で購入できるようになります。
                値下げ依頼は購入を確約するものではありません。
            </p>

            <button
                class="primary"
                style="width:100%;margin-top:10px;"
                onclick="sendPriceRequest()"
            >
                値下げを依頼する
            </button>

        </div>
    </div>
</div>

<!-- =========================
     PURCHASE MODAL
========================= -->

<div
    class="modal"
    id="purchaseModal"
>
    <div class="modal-box modal-small">

        <button
            class="modal-close"
            onclick="closeModal('purchaseModal')"
        >
            ×
        </button>

        <div class="modal-content">

            <h2>購入確認</h2>

            <div
                class="purchase-summary"
                id="purchaseSummary"
            ></div>

            <button
                class="primary"
                style="width:100%;"
                onclick="completePurchase()"
            >
                購入を確定する
            </button>

        </div>

    </div>
</div>

<!-- =========================
     NOTIFICATION MODAL
========================= -->

<div
    class="modal"
    id="notificationModal"
>
    <div class="modal-box modal-small">

        <button
            class="modal-close"
            onclick="closeModal('notificationModal')"
        >
            ×
        </button>

        <div
            class="modal-content"
            id="notifications"
        ></div>

    </div>
</div>

<!-- =========================
     MYPAGE MODAL
========================= -->

<div
    class="modal"
    id="mypageModal"
>
    <div class="modal-box">

        <button
            class="modal-close"
            onclick="closeModal('mypageModal')"
        >
            ×
        </button>

        <div class="modal-content">

            <div class="mypage">

                <div class="my-menu">

                    <button onclick="showMySection('profile')">
                        アカウント
                    </button>

                    <button onclick="showMySection('history')">
                        購入した商品
                    </button>

                    <button onclick="showMySection('likes')">
                        いいね！した商品
                    </button>

                    <button onclick="showMySection('selling')">
                        出品した商品
                    </button>

                </div>

                <div
                    class="my-content"
                    id="myContent"
                ></div>

            </div>

        </div>
    </div>
</div>

<!-- =========================
     SELL MODAL
========================= -->

<div
    class="modal"
    id="sellModal"
>
    <div class="modal-box modal-small">

        <button
            class="modal-close"
            onclick="closeModal('sellModal')"
        >
            ×
        </button>

        <div class="modal-content">

            <h2>商品の出品</h2>

            <form id="sellForm">

                <div class="form-group">

                    <label>
                        商品名
                    </label>

                    <input
                        id="sellName"
                        required
                        placeholder="商品名を入力"
                    >

                </div>

                <div class="form-group">

                    <label>
                        商品説明
                    </label>

                    <textarea
                        id="sellDescription"
                        required
                        placeholder="商品の状態などを入力"
                    ></textarea>

                </div>

                <div class="form-group">

                    <label>
                        カテゴリ
                    </label>

                    <select id="sellCategory">

                        <option>
                            その他
                        </option>

                        <option>
                            レディース
                        </option>

                        <option>
                            メンズ
                        </option>

                        <option>
                            ベビー・キッズ
                        </option>

                        <option>
                            ゲーム・おもちゃ・グッズ
                        </option>

                        <option>
                            家電・スマホ・カメラ
                        </option>

                        <option>
                            本・音楽・ゲーム
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label>
                        販売価格
                    </label>

                    <input
                        id="sellPrice"
                        type="number"
                        min="300"
                        required
                        placeholder="300"
                    >

                </div>

                <button
                    class="primary"
                    style="width:100%;"
                    type="submit"
                >
                    出品する
                </button>

            </form>

        </div>
    </div>
</div>

<!-- =========================
     TOAST
========================= -->

<div
    class="toast"
    id="toast"
></div>

<script>

/* =====================================================
   DATA
===================================================== */

let products = [

    {
        id:1,
        name:"Nintendo Switch 本体",
        description:"Nintendo Switch本体です。動作確認済みです。多少の使用感があります。",
        price:24800,
        category:"ゲーム・おもちゃ・グッズ",
        condition:"やや傷や汚れあり",
        shipping:"送料込み",
        seller:"ゲーム好き",
        likes:34,
        image:"https://images.unsplash.com/photo-1578303512597-81e6cc155b3e?auto=format&fit=crop&w=800&q=80",
        created:Date.now()-100000
    },

    {
        id:2,
        name:"ワイヤレスイヤホン",
        description:"数回使用しました。ケース付きです。",
        price:4800,

    name:"あなた",

    likes:[],

    purchased:[],

    selling:[]

};


/* =====================================================
   STATE
===================================================== */

let currentCategory = "すべて";

let currentProductId = null;

let purchaseProductId = null;

let notifications = [];

let priceRequests = [];


/* =====================================================
   ELEMENTS
===================================================== */

const productsElement =
    document.getElementById("products");

const emptyElement =
    document.getElementById("empty");

const searchInput =
    document.getElementById("searchInput");

const sortSelect =
    document.getElementById("sortSelect");

const resultCount =
    document.getElementById("resultCount");


/* =====================================================
   RENDER PRODUCTS
===================================================== */

function renderProducts(){

    const keyword =
        searchInput.value.trim().toLowerCase();

    let result =
        products.filter(product => {

            const matchCategory =
                currentCategory === "すべて" ||
                product.category === currentCategory;

            const matchKeyword =
                !keyword ||
                product.name.toLowerCase().includes(keyword) ||
                product.description.toLowerCase().includes(keyword);

            const sold =
                player.purchased.includes(product.id);

            return matchCategory &&
                   matchKeyword &&
                   !sold;

        });


    const sort =
        sortSelect.value;


    if(sort === "new"){

        result.sort((a,b)=>
            b.created-a.created
        );

    }

    else if(sort === "low"){

        result.sort((a,b)=>
            a.price-b.price
        );

    }

    else if(sort === "high"){

        result.sort((a,b)=>
            b.price-a.price
        );

    }

    else if(sort === "like"){

        result.sort((a,b)=>
            b.likes-a.likes
        );

    }


    productsElement.innerHTML = "";


    result.forEach(product => {

        const liked =
            player.likes.includes(product.id);

        const element =
            document.createElement("article");

        element.className = "product";

        element.onclick = () =>
            openProduct(product.id);


        element.innerHTML = `

            <img
                class="product-image"
                src="${product.image}"
                alt=""
            >

            <div class="product-body">

                <div class="product-name">
                    ${escapeHtml(product.name)}
                </div>

                <div class="product-price">
                    ￥${formatPrice(product.price)}
                </div>

                <div class="product-meta">
                    ${escapeHtml(product.condition)}
                    ・${escapeHtml(product.shipping)}
                </div>

                <div class="product-like">

                    <button
                        class="like-button ${liked ? "liked" : ""}"
                        onclick="event.stopPropagation();toggleLike(${product.id})"
                    >
                        ${liked ? "♥" : "♡"}
                        ${product.likes}
                    </button>

                    <span>
                        ${escapeHtml(product.seller)}
                    </span>

                </div>

            </div>
        `;

        productsElement.appendChild(element);

    });


    resultCount.textContent =
        `${result.length}件の商品`;


    if(result.length === 0){

        emptyElement.classList.add("show");

    }else{

        emptyElement.classList.remove("show");

    }

}

/* =====================================================
   LIKE
===================================================== */

function toggleLike(id){

    const product =
        products.find(p=>p.id===id);

    if(!product) return;


    const index =
        player.likes.indexOf(id);


    if(index === -1){

        player.likes.push(id);

        product.likes++;

        showToast("いいね！しました");

    }else{

        player.likes.splice(index,1);

        product.likes =
            Math.max(0,product.likes-1);

        showToast("いいね！を解除しました");

    }


    renderProducts();


    if(currentProductId === id){

        openProduct(id);

    }

}


/* =====================================================
   PRICE REQUEST
===================================================== */

function openPriceRequest(id){

    const product =
        products.find(p=>p.id===id);

    if(!product) return;


    if(product.price <= 300){

        showToast(
            "この商品は値下げ依頼できません"
        );

        return;

    }


    currentProductId = id;


    document.getElementById(
        "priceRequestProduct"
    ).textContent =
        product.name;


    document.getElementById(
        "requestCurrentPrice"
    ).textContent =
        `￥${formatPrice(product.price)}`;


    document.getElementById(
        "requestPrice"
    ).value = "";


    closeModal("productModal");

    document
        .getElementById("priceModal")
        .classList.add("show");

}


function sendPriceRequest(){

    const product =
        products.find(p=>p.id===currentProductId);

    if(!product) return;


    const input =
        document.getElementById("requestPrice");

    const price =
        Number(input.value);


    if(!price || price < 300){

        showToast(
            "300円以上の価格を入力してください"
        );

        return;

    }


    if(price >= product.price){

        showToast(
            "現在価格より安い金額を入力してください"
        );

        return;

    }


    priceRequests.push({

        id:Date.now(),

        productId:product.id,

        productName:product.name,

        originalPrice:product.price,

        requestedPrice:price,

        status:"pending"

    });


    notifications.push({

        type:"request",

        title:"値下げ依頼を送信しました",

        text:
            `${product.name}に￥${formatPrice(price)}の値下げ依頼を送りました。`

    });


    closeModal("priceModal");

    updateNotice();

    showToast(
        "値下げ依頼を送りました"
    );

}


/* =====================================================
   SIMULATED SELLER RESPONSE
===================================================== */

function acceptPriceRequest(requestId){

    const request =
        priceRequests.find(
            r=>r.id===requestId
        );

    if(!request) return;


    const product =
        products.find(
            p=>p.id===request.productId
        );

    if(!product) return;


    product.price =
        request.requestedPrice;


    request.status =
        "accepted";


    notifications.push({

        type:"accepted",

        title:"値下げ依頼が承諾されました",

        text:
            `${product.name}が￥${formatPrice(product.price)}になりました。`

    });


    updateNotice();

    showToast(
        "値下げ依頼が承諾されました"
    );


    renderProducts();

}


function rejectPriceRequest(requestId){

    const request =
        priceRequests.find(
            r=>r.id===requestId
        );

    if(!request) return;


    request.status =
        "rejected";


    notifications.push({

        type:"rejected",

        title:"値下げ依頼が見送られました",

        text:
            `${request.productName}の値下げ依頼は見送られました。`

    });


    updateNotice();

    showToast(
        "値下げ依頼を見送りました"
    );

}

            )}

        .getElementById("purchaseModal")
        .classList.add("show");

}


function completePurchase(){

    const product =
        products.find(
            p=>p.id===purchaseProductId
        );

    if(!product) return;


    if(player.balance < product.price){

        showToast(
            "所持金が足りません"
        );

        closeModal("purchaseModal");

        return;

    }


    player.balance -=
        product.price;


    player.purchased.push(
        product.id
    );


    const acceptedRequest =
        priceRequests.find(
            r =>
                r.productId === product.id &&
                r.status === "accepted"
        );


    if(acceptedRequest){

        acceptedRequest.status =
            "purchased";

    }


    notifications.push({

        type:"purchase",

        title:"購入しました",

        text:
            `${product.name}を購入しました。`

    });


    closeModal("purchaseModal");

    closeModal("productModal");

    renderProducts();

    updateNotice();

    showToast(
        "購入が完了しました"
    );

}

function updateNotice(){

        document.getElementById("notice");


    if(notifications.length > 0){

        document.getElementById(
            "noticeTitle"

            latest.title;


        document.getElementById(
            "noticeText"
        ).textContent =
            latest.text;


        notice.classList.add("show");

    }else{

        notice.classList.remove("show");

    }

}

                    "sellName"
                ).value.trim();


            const description =
                document.getElementById(
                    "sellDescription"
                ).value.trim();


            const category =
                document.getElementById(
                    "sellCategory"
                ).value;


            const price =
                Number(
                    document.getElementById(
                        "sellPrice"
                    ).value
                );


            if(!name ||
               !description ||
               !price ||
               price < 300){

                showToast(
                    "入力内容を確認してください"
                );

                return;

            }


            const product = {

                id:
                    Date.now(),

                name,

                description,

                price,

                category,

                condition:
                    "目立った傷や汚れなし",

                shipping:
                    "送料込み",

                seller:
                    player.name,

                likes:0,

                image:
                    "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=800&q=80",

                created:
                    Date.now()

            };


            products.unshift(product);

            player.selling.push(
                product.id
            );


            this.reset();

            closeModal("sellModal");

            renderProducts();

            showToast(
                "商品を出品しました"
            );

        }
    );


/* =====================================================
   SEARCH
===================================================== */

searchInput.addEventListener(
    "input",
    renderProducts
);


/* =====================================================
   SORT
===================================================== */

sortSelect.addEventListener(
    "change",
    renderProducts
);


/* =====================================================
   CATEGORY
===================================================== */

document
    .querySelectorAll(".category-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            function(){

                document
                    .querySelectorAll(
                        ".category-button"
                    )
                    .forEach(
                        b =>
                        b.classList.remove(
                            "active"
                        )
                    );


                this.classList.add("active");


                currentCategory =
                    this.dataset.category;


                renderProducts();

            }
        );

    });


/* =====================================================
   MODAL
===================================================== */

function closeModal(id){

    document
        .getElementById(id)
        .classList.remove("show");

}


function outsideClose(event,id){

    if(event.target.id === id){

        closeModal(id);

    }

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById("toast");


    toast.textContent =
        message;


    toast.classList.add("show");


    clearTimeout(toastTimer);


    toastTimer =
        setTimeout(
            () =>
            toast.classList.remove("show"),
            2400
        );

}


/* =====================================================
   UTIL
===================================================== */

function formatPrice(number){

    return Number(number)
        .toLocaleString("ja-JP");

}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =====================================================
   START
===================================================== */

renderProducts();

</script>
